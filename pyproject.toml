[project]
name = "voice-edge"
version = "0.1.0"
description = "Voice Edge AI is a macOS-focused local voice and AI platform. It combines local MLX language and vision models, faster-whisper/apple speech recognition, streaming Edge-TTS synthesis, OpenAI-compatible HTTP APIs, MCP tools, native macOS dictation, Xiaomi XiaoAI integration, and browser-backed AI providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "camoufox[geoip]>=0.5.4",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "mcp>=1.28.1",
    "mlx-embeddings",
    "mlx-vlm",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pyobjc-framework-quartz>=12.2.1",
    "pyperclip>=1.11.0",
    "scipy>=1.17.1",
    # DO NOT bump to sherpa-onnx 1.13.4 / onnxruntime 1.27.0: that combo ships an
    # onnxruntime KleidiAI SME conv kernel that computes wrong results on Apple
    # Silicon with FEAT_SME=1 (M4), making KeywordSpotter silently return empty
    # (verified 0/7 vs 4/7 on the official KWS test_wavs; upstream k2-fsa/sherpa-onnx#3791).
    # Pin to the last known-good pair; revisit only when 1.13.5 + onnxruntime>=1.27.1 lands.
    "onnxruntime==1.24.4",
    "sherpa-onnx==1.13.3",
    "sounddevice>=0.5.5",
    "starlette>=1.3.1",
    "tavily-python>=0.7.26",
    "uvicorn>=0.51.0",
    "pypinyin>=0.55.0",
    "cryptography>=49.0.0",
    "bleak>=3.0.2",
    "pycryptodome>=3.23.0",
]

[project.scripts]
start = "voice_edge:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["voice_edge"]

[tool.uv.sources]
mlx-vlm = { git = "https://github.com/Blaizzy/mlx-vlm.git" }
mlx-embeddings = { git = "https://github.com/woniuzfb/mlx-embeddings.git" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "ASYNC",
    "RUF",
]

ignore = [
    "UP006",
    "UP007",
    "UP034",
    "UP035",
    "UP045",
    "RUF046",
    "RUF059",
]

allowed-confusables = ["（", "）", "，", "：", "！", "？", "；", "’", "。"]
